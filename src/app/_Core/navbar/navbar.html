<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
  <div class="container">
    <!-- Logo -->
    <a class="navbar-brand d-flex align-items-center" routerLink="/">
      <img
        src="https://ngu.edu.eg/wp-content/uploads/2021/02/Logo-PNG-100x100.png"
        alt="NGU Logo"
        height="50"
        class="me-2"
        style="border-radius: 6px; background: #7f0e3d"
      />

      <span class="fw-bold"> New Giza University </span>
    </a>

    <!-- Mobile Toggle -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navbar -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <!-- About -->
        <li class="nav-item">
          <a class="nav-link" routerLink="/about" routerLinkActive="active"> About </a>
        </li>

        <!-- Academics Dropdown -->
        <li class="nav-item dropdown-custom">
          <a
            class="nav-link"
            href="javascript:void(0)"
            (click)="toggleDropdown()"
            [class.active]="dropdownOpen()"
          >
            Academics
            <i class="fa fa-chevron-down ms-1"></i>
          </a>

          <ul class="dropdown-menu-custom" [class.show]="dropdownOpen()">
            @if (loading()) {
              <li>
                <span class="dropdown-item text-muted"> Loading... </span>
              </li>
            } @else {
              @for (school of schools(); track school.id) {
                <li>
                  <a
                    class="dropdown-item"
                    [routerLink]="['/school', school.id]"
                    (click)="closeDropdown()"
                  >
                    {{ school.school_Name }}
                  </a>
                </li>
              } @empty {
                <li>
                  <span class="dropdown-item text-muted"> No schools found </span>
                </li>
              }
            }
          </ul>
        </li>

        <!-- Admission -->
        <li class="nav-item">
          <a class="nav-link" routerLink="/admission" routerLinkActive="active"> Admission </a>
        </li>

        <!-- News -->
        <li class="nav-item">
          <a class="nav-link" routerLink="/news" routerLinkActive="active"> News </a>
        </li>

        <!-- Contact -->
        <li class="nav-item">
          <a class="nav-link" routerLink="/contact" routerLinkActive="active"> Contact </a>
        </li>

        <!-- Apply -->
        <li class="nav-item ms-lg-3">
          <a class="btn btn-primary px-4 rounded-pill" routerLink="/apply"> Apply Now </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
